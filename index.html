<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Calorie Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #ffffff;
            --border: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            text-align: center;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, button {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95krem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-info span {
            display: block;
        }

        .food-name {
            font-weight: 500;
        }

        .food-cals {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5555;
            cursor: pointer;
            font-size: 1rem;
            width: auto;
            padding: 4px 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tracker</h1>
            <span id="current-date" style="font-size: 0.85rem; color: var(--text-muted);"></span>
        </header>

        <!-- Summary Card -->
        <div class="card">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="total-cals">0</div>
                    <div class="stat-label">Calories Consumed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="goal-cals">2500</div>
                    <div class="stat-label">Daily Goal</div>
                </div>
            </div>
        </div>

        <!-- Input Form Card -->
        <div class="card">
            <form id="log-form">
                <input type="text" id="food-input" placeholder="Food item (e.g., Chicken breast, Rice)" required autocomplete="off">
                <input type="number" id="cals-input" placeholder="Calories" required min="0">
                <button type="submit">Add Entry</button>
            </form>
        </div>

        <!-- Log History Card -->
        <div class="card">
            <h3 style="margin-top: 0; font-size: 1rem; color: var(--text-muted);">Today's Log</h3>
            <div id="log-list">
                <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">No entries yet today.</p>
            </div>
        </div>
    </div>

    <!-- Firebase v10 SDK via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // TODO: Replace with your actual Firebase project configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        let totalCalories = 0;

        async function fetchLogs() {
            const listEl = document.getElementById('log-list');
            listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">Loading...</p>';
            
            try {
                const q = query(collection(db, "calorie_logs"), where("date", "==", todayStr));
                const querySnapshot = await getDocs(q);
                
                listEl.innerHTML = '';
                totalCalories = 0;

                if (querySnapshot.empty) {
                    listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">No entries yet today.</p>';
                    document.getElementById('total-cals').innerText = 0;
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    totalCalories += Number(data.calories);

                    const itemEl = document.createElement('div');
                    itemEl.className = 'log-item';
                    itemEl.innerHTML = `
                        <div class="log-info">
                            <span class="food-name">${data.food}</span>
                            <span class="food-cals">${data.calories} kcal</span>
                        </div>
                        <button class="delete-btn" data-id="${documentSnapshot.id}">×</button>
                    `;
                    listEl.appendChild(itemEl);
                });

                document.getElementById('total-cals').innerText = totalCalories;

                // Bind delete buttons
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        await deleteDoc(doc(db, "calorie_logs", id));
                        fetchLogs();
                    });
                });

            } catch (error) {
                console.error("Error fetching logs: ", error);
                listEl.innerHTML = '<p style="text-align: center; color: #ff5555; font-size: 0.9rem;">Error loading data.</p>';
            }
        }

        document.getElementById('log-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const food = document.getElementById('food-input').value;
            const calories = Number(document.getElementById('cals-input').value);

            try {
                await addDoc(collection(db, "calorie_logs"), {
                    food,
                    calories,
                    date: todayStr,
                    timestamp: Date.now()
                });
                document.getElementById('food-input').value = '';
                document.getElementById('cals-input').value = '';
                fetchLogs();
            } catch (error) {
                console.error("Error adding document: ", error);
            }
        });

        fetchLogs();
    </script>
</body>
</html>
